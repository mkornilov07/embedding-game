{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Embedding Game{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'game/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'game/site.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
{% if user.is_authenticated %}
<div class="nav">
  {% if user.is_staff %}<a href="{% url 'debug_tools' %}">Debug Tools</a>{% endif %}
  <span>{{ user.username }}</span>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Log Out</button></form>
</div>
{% endif %}
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
